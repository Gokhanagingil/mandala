name: Android release validation
on:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Game checks
        run: |
          npm run build
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build release baseline and candidate
        run: |
          mkdir -p apk-output native-qa
          gradle -p android --no-daemon assembleRelease -PandroidTestBuildType=release -PmangalaVersionCode=14001 -PmangalaVersionName=1.4.0
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Mangala-1.4.0-baseline-unsigned.apk
          gradle -p android --no-daemon assembleRelease assembleReleaseAndroidTest lintRelease -PandroidTestBuildType=release
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Mangala-1.4.1-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 apk-output/Mangala-1.4.1-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk-output/Mangala-1.4.1-unsigned.apk > apk-output/package-info.txt
          python3 scripts/android-release-info.py apk-output/Mangala-1.4.1-unsigned.apk apk-output/package-info.txt
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          git rev-parse HEAD > apk-output/source-commit.txt
      - name: Sign QA copies without access to production key
        run: |
          python3 -c 'import secrets,pathlib; pathlib.Path("native-qa/password").write_text(secrets.token_urlsafe(48))'
          chmod 600 native-qa/password
          keytool -genkeypair -keystore native-qa/qa.p12 -storetype PKCS12 -storepass:file native-qa/password -keypass:file native-qa/password -alias qa-only -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Ephemeral CI QA' -noprompt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks native-qa/qa.p12 --ks-pass file:native-qa/password --key-pass file:native-qa/password --out native-qa/baseline.apk apk-output/Mangala-1.4.0-baseline-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks native-qa/qa.p12 --ks-pass file:native-qa/password --key-pass file:native-qa/password --out native-qa/candidate.apk apk-output/Mangala-1.4.1-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks native-qa/qa.p12 --ks-pass file:native-qa/password --key-pass file:native-qa/password --out native-qa/tests.apk android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          rm native-qa/qa.p12 native-qa/password
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release install, upgrade and gameplay tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: python3 scripts/android-device-check.py
      - name: Stage verified release inputs
        run: |
          cp native-qa/validation.json apk-output/native-validation.json
          cd apk-output
          sha256sum *.apk apksigner.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Mangala-1.4.1-release-inputs
          path: apk-output/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mangala-release-validation
          path: |
            android/app/build/reports/
            native-qa/*.txt
            native-qa/validation.json
          retention-days: 30
