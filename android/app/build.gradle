plugins { id 'com.android.application' }

android {
    namespace 'com.gokhanagingil.mangala'
    compileSdk 36
    defaultConfig {
        applicationId 'com.gokhanagingil.mangala'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('mangalaVersionCode').getOrElse('14002').toInteger()
        versionName providers.gradleProperty('mangalaVersionName').getOrElse('1.4.1')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'app_name', 'Mangala'
    }
    testBuildType providers.gradleProperty('androidTestBuildType').getOrElse('debug')
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Mangala Deneme'
        }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
    lint { abortOnError true; checkReleaseBuilds true }
}
def androidAssets = tasks.register('prepareAndroidAssets', Exec) {
    workingDir rootProject.file('..')
    commandLine 'node', 'scripts/android-assets.mjs'
}
def gameAssets = tasks.register('syncGameAssets', Sync) {
    dependsOn androidAssets
    from('../generated')
    into layout.buildDirectory.dir('generated/gameAssets')
}
def testFixture = tasks.register('prepareAndroidTestFixture', Exec) {
    workingDir rootProject.file('..')
    commandLine 'node', 'scripts/android-fixture.mjs'
}
tasks.configureEach { if (name in ['preDebugAndroidTestBuild', 'preReleaseAndroidTestBuild']) dependsOn testFixture }
tasks.named('preBuild').configure { dependsOn gameAssets }
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
