plugins { id 'com.android.application' }

android {
    namespace 'com.gokhanagingil.mangala'
    compileSdk 36
    defaultConfig {
        applicationId 'com.gokhanagingil.mangala'
        minSdk 26
        targetSdk 36
        versionCode 14001
        versionName '1.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'app_name', 'Mangala'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Mangala Deneme'
        }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
    lint { abortOnError true; checkReleaseBuilds true }
}
def gameAssets = tasks.register('syncGameAssets', Sync) {
    from('../../dist') { into 'www' }
    into layout.buildDirectory.dir('generated/gameAssets')
}
tasks.named('preBuild').configure { dependsOn gameAssets }
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
